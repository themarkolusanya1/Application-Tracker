<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 300px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 16px;
        background-color: #f7f9fb;
        color: #191c1e;
      }
      .container {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 8px;
      }
      .logo-icon {
        width: 24px;
        height: 24px;
        background: linear-gradient(135deg, #6366f1, #00bcd4);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 14px;
      }
      .title {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .subtitle {
        font-size: 11px;
        color: #64748b;
        margin: 0;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      label {
        font-size: 10px;
        font-weight: 700;
        color: #475569;
        text-transform: uppercase;
      }
      input, select, textarea {
        padding: 8px;
        font-size: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background-color: white;
      }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #6366f1;
      }
      .btn {
        background: linear-gradient(90deg, #6366f1, #00bcd4);
        color: white;
        border: none;
        padding: 10px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
        transition: opacity 0.2s;
        text-align: center;
      }
      .btn:hover {
        opacity: 0.95;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status-msg {
        padding: 8px;
        border-radius: 6px;
        font-size: 11px;
        display: none;
      }
      .status-success {
        background-color: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #065f46;
      }
      .status-error {
        background-color: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo-icon">T</div>
        <div>
          <h4 class="title">TrackIT Scraper</h4>
          <p class="subtitle">Quickly capture application details</p>
        </div>
      </div>

      <div id="status-msg"></div>

      <div class="form-group">
        <label for="app-type">Application Type</label>
        <select id="app-type">
          <option value="job">Corporate Job / Internship</option>
          <option value="scholarship">University & Scholarship</option>
        </select>
      </div>

      <div class="form-group">
        <label for="org">Organization / School</label>
        <input type="text" id="org" placeholder="Google, Oxford, etc." />
      </div>

      <div class="form-group">
        <label for="role-title">Title / Program</label>
        <input type="text" id="role-title" placeholder="Software Engineer, MSc PhD..." />
      </div>

      <div class="form-group">
        <label for="notes">Notes / Requirements</label>
        <textarea id="notes" rows="2" placeholder="Syllabus, GPA, salary, description..."></textarea>
      </div>

      <button id="sync-btn" class="btn">Sync to TrackIT</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
