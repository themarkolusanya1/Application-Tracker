<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MyTraks - Login</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Font: Montserrat -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
          },
          colors: {
            vanguard: {
              primary: '#6366f1',
              cyan: '#06b6d4',
              surface: '#f7f9fb',
              'container-lowest': '#ffffff',
              'text-muted': '#64748b',
            }
          },
          borderRadius: {
            'vanguard': '2.5rem',
            'vanguard-inner': '1rem',
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.15)',
            'float': '0 25px 50px -12px rgba(99, 102, 241, 0.25)',
          }
        }
      }
    }
  </script>
<style data-purpose="background-styles">
    body {
      background: #f7f9fb;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* Animated Gradient Background */
    .bg-animated {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(-45deg, #f0f4ff, #e0f2fe, #f7f9fb, #eef2ff);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      z-index: -2;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Abstract shapes for depth */
    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.4;
      animation: float-shape 20s infinite alternate;
    }
    .shape-1 {
      width: 400px;
      height: 400px;
      background: #6366f1;
      top: -100px;
      right: -100px;
    }
    .shape-2 {
      width: 300px;
      height: 300px;
      background: #06b6d4;
      bottom: -50px;
      left: -50px;
      animation-delay: -5s;
    }

    @keyframes float-shape {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(20px, 40px) scale(1.1); }
    }

    /* Floating card animation */
    .floating-card {
      animation: float-card 6s ease-in-out infinite;
    }

    @keyframes float-card {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }

    .glass-effect {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
  </style>
<style data-purpose="custom-utilities">
    .gradient-button {
      background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gradient-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
    }
    .logo-text {
      color: #6366f1;
      background: linear-gradient(to right, #6366f1, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="font-sans flex flex-col items-center justify-center p-6 relative">
<div class="bg-animated"></div>
<div class="shape shape-1"></div>
<div class="shape shape-2"></div>
<!-- BEGIN: MainHeader -->
<header class="flex flex-col items-center mb-10 z-10" data-purpose="brand-header">
<div class="w-24 h-24 bg-white/80 backdrop-blur-md rounded-3xl shadow-xl flex items-center justify-center mb-5 p-3 border border-white/50">
<!-- MyTraks Logo -->
<img alt="MyTraks Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBwytUbecYlmiaVMgOrc2uUPXjS8IgVj2zQJweiqgGKE_wRwp_hd6cePvk-eXAwTyD-1T9lxaeBTF-3W_rqV-OPz5ir7_C1pbxbrI5jfqNQAVjcMOsTcXZweEKBHBwXxF52x2Vy9I4-BdUNgsoFlqa25izKIgqJwfytIAF0BrL9NIsE1uGcFI9PFwqJZlVABilyfs3MlSwz1PpX1fQGtXWacKCmCDwtac8aZDahpRYAiRIdrGvJbH9cm-twXRDPzsKdR_dxC1dtzG8" style="object-position: 50% 10%;"/>
</div>
<h1 class="text-5xl font-bold logo-text tracking-tighter">MyTraks</h1>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: LoginCard -->
<main class="w-full max-w-lg glass-effect shadow-glass rounded-vanguard px-8 pt-14 pb-12 sm:px-16 floating-card z-10" data-purpose="login-container">
<div class="text-center mb-12">
<h2 class="text-4xl font-bold text-gray-900 mb-4">Welcome back</h2>
<p class="text-vanguard-text-muted text-lg">Securely access your analytics portal</p>
</div>
<!-- BEGIN: LoginForm -->
<form action="#" class="space-y-8" data-purpose="login-form" method="POST">
<!-- Email Field -->
<div class="space-y-2.5">
<label class="block text-sm font-bold text-gray-700 ml-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
<!-- Mail Icon -->
<svg class="h-5 w-5 text-gray-400 group-focus-within:text-vanguard-primary transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="block w-full pl-12 pr-5 py-4.5 bg-white/50 border border-gray-200/60 rounded-vanguard-inner text-gray-900 placeholder-gray-400 focus:ring-4 focus:ring-vanguard-primary/10 focus:border-vanguard-primary transition-all outline-none" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2.5">
<div class="flex justify-between items-center px-1">
<label class="block text-sm font-bold text-gray-700" for="password">Password</label>
<a class="text-xs font-semibold text-vanguard-primary hover:text-vanguard-cyan transition-colors" href="#">Forgot?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
<!-- Lock Icon -->
<svg class="h-5 w-5 text-gray-400 group-focus-within:text-vanguard-primary transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="block w-full pl-12 pr-5 py-4.5 bg-white/50 border border-gray-200/60 rounded-vanguard-inner text-gray-900 placeholder-gray-400 focus:ring-4 focus:ring-vanguard-primary/10 focus:border-vanguard-primary transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Sign In Button -->
<div class="pt-4">
<button class="w-full gradient-button text-white font-bold py-5 px-6 rounded-vanguard-inner shadow-lg shadow-indigo-100 focus:outline-none focus:ring-4 focus:ring-vanguard-primary/30 transform active:scale-[0.97] transition-all text-lg" type="submit">
          Sign In to Dashboard
        </button>
</div>
</form>
<!-- END: LoginForm -->
<!-- BEGIN: CardFooter -->
<div class="mt-12 text-center" data-purpose="form-footer">
<p class="text-vanguard-text-muted text-sm font-medium">
        Don't have an account? 
        <a class="text-vanguard-primary hover:text-vanguard-cyan font-bold transition-colors decoration-2 underline-offset-4 hover:underline" href="#">Create Account</a>
</p>
</div>
<!-- END: CardFooter -->
</main>
<!-- END: LoginCard -->
<footer class="mt-12 text-vanguard-text-muted/60 text-xs font-medium z-10">
  © 2024 MyTraks Inc. All rights reserved.
</footer>
</body></html>
